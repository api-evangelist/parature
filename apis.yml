name: Parature
description: 'Parature was a cloud-based customer service and self-service knowledge base
  company founded around 2000 (originally as Cyracle) and headquartered in Herndon, Virginia.
  Its SaaS suite covered a customer self-service knowledge base, ticketing/case management,
  live chat, and social customer service, and it exposed a developer API for managing knowledge
  base articles, tickets, and related data. Microsoft acquired Parature for a reported $100
  million in January 2014 and folded its capabilities into Microsoft Dynamics CRM / Dynamics
  365 for Customer Service. Parature from Microsoft stopped selling to new customers on
  November 1, 2016 and the standalone service was fully retired (end of support) on May 15,
  2018. This is a historical/defunct company profile: the parature.com domain no longer
  resolves and there is no live developer portal, documentation, or API surface to enrich.'
